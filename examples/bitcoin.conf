# Example bitcoin.conf for romeujr/bitcoin-core.
# https://github.com/romeujr/docker-bitcoin-core
#
# Copy it to the data directory on the host (the directory mounted at
# /home/bitcoin/.bitcoin), adjust it and restart the container.
# Command-line arguments override this file.
#
# Every option: docker run --rm romeujr/bitcoin-core -help -help-debug
# Full reference generated by Bitcoin Core:
#   https://github.com/bitcoin/bitcoin/blob/master/doc/bitcoin-conf.md
#
# Do NOT set "daemon=1": the container refuses it (bitcoind must stay in the
# foreground to receive the stop signal and shut down cleanly).

# --- Network ----------------------------------------------------------------
# chain=main               # main | test | testnet4 | signet | regtest
# listen=1                 # accept inbound P2P connections (publish 8333)
# maxconnections=40
# blocksonly=1             # do not relay unconfirmed transactions (saves bandwidth)
# maxuploadtarget=5000     # MiB per 24h

# --- Storage and performance ------------------------------------------------
dbcache=2048               # MiB of UTXO cache; larger = faster initial sync
# prune=10000              # keep only ~10 GB of blocks (incompatible with txindex)

# --- Indexes ----------------------------------------------------------------
# txindex=1
# blockfilterindex=1
# peerblockfilters=1
# coinstatsindex=1

# --- RPC --------------------------------------------------------------------
server=1
# Authentication: the cookie file (.cookie in the data directory) is used by
# default. For fixed credentials, generate a hashed line with rpcauth.py:
#   https://github.com/bitcoin/bitcoin/tree/master/share/rpcauth
# rpcauth=alice:<salt>$<hash>

# --- ZMQ --------------------------------------------------------------------
# zmqpubrawblock=tcp://0.0.0.0:28332
# zmqpubrawtx=tcp://0.0.0.0:28333
# zmqpubhashblock=tcp://0.0.0.0:28332

# --- Tor --------------------------------------------------------------------
# proxy=tor:9050
# onlynet=onion
# torcontrol=tor:9051

# --- Wallet -----------------------------------------------------------------
# disablewallet=1

# --- Logging ----------------------------------------------------------------
# nodebuglogfile=1         # log only to the console (docker logs)

# Network-specific options go in sections. RPC must listen on all interfaces
# inside the container to be reachable through Docker.
[main]
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16

[testnet4]
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12

[signet]
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12

[regtest]
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12
